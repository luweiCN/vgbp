<!DOCTYPE html>
<html>
<head>
    <title>Debug Environment Variables</title>
</head>
<body>
    <h1>Environment Variables Debug</h1>
    <pre id="debug"></pre>
    <script>
        const debug = document.getElementById('debug');
        debug.innerHTML = `
VITE_SUPABASE_URL: ${import.meta.env.VITE_SUPABASE_URL || 'NOT FOUND'}
VITE_SUPABASE_ANON_KEY: ${import.meta.env.VITE_SUPABASE_ANON_KEY ? 'EXISTS' : 'NOT FOUND'}
NODE_ENV: ${import.meta.env.NODE_ENV || 'NOT FOUND'}
MODE: ${import.meta.env.MODE || 'NOT FOUND'}

All env vars:
${JSON.stringify(import.meta.env, null, 2)}
        `;
    </script>
</body>
</html>
