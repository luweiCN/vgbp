# Nixpacks 配置文件 - 用于 Coolify 部署 Vainglory Draft Assistant
# 部署方式：静态站点托管
# Web 服务器：Nginx
# 部署路径：根路径

# ================================
# 基础环境配置
# ================================
[phases.setup]
nixPkgs = ["nodejs_20"]
# 使用 Node.js 20 LTS

# ================================
# 安装依赖阶段
# ================================
[phases.install]
cmds = [
    "npm ci",                           # 安装依赖
    "npm cache clean --force"           # 清理缓存以减小镜像大小
]

# ================================
# 构建阶段
# ================================
[phases.build]
cmds = [
    # 运行自定义 i18n 脚本
    "echo '=== 准备国际化文件 ==='",
    "node scripts/copy-i18n.mjs",

    # 执行构建（使用完整路径）
    "echo '=== 开始构建 ==='",
    "./node_modules/.bin/vite build",

    # 验证构建输出
    "echo '=== 验证构建输出 ==='",
    "ls -la dist/",
    "test -f dist/index.html || (echo '❌ index.html 未找到' && exit 1)",
    "test -f dist/sw.js && echo '✓ Service Worker 已生成' || echo '⚠️ Service Worker 未生成'",
    "echo '构建完成！'"
]

# ================================
# 开始阶段（静态站点不需要运行时）
# ================================
[start]
cmd = "echo '=== 静态站点部署完成 ===' && echo '应用已准备就绪'"

# ================================
# 环境变量配置
# ================================
[variables]
# Node.js 环境
NODE_ENV = "production"

# Supabase 配置（在 Coolify 中设置实际值）
VITE_SUPABASE_URL = "https://sxkozhhlhvxdnwirbubw.supabase.co"
VITE_SUPABASE_ANON_KEY = ""

# Gemini AI 配置（在 Coolify 中设置实际值）
GEMINI_API_KEY = ""

# 构建信息
BUILD_DATE = "${DATE}"
BUILD_TIME = "${DATETIME}"

# ================================
# 部署配置
# ================================
[deploy]
# 静态站点部署配置
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "never"  # 静态站点不需要重启
restartPolicyMaxRetries = 0

# ================================
# 资源限制
# ================================
[resources]
# 静态站点资源需求较低
limits = { cpu = "0.5", memory = "256Mi" }
reservations = { cpu = "0.1", memory = "64Mi" }

# ================================
# 构建输出目录
# ================================
[build]
# 静态文件将被复制到 deploy 目录
dist = "dist"

# ================================
# 安全清理
# ================================
# 确保敏感文件不被包含在构建中
[phases.security]
cmds = [
    "rm -f dist/.env*",
    "echo '=== 安全清理完成 ==='"
]