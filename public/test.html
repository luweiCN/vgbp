<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Environment Test</title>
</head>
<body>
    <h1>Environment Variables Test</h1>
    <div id="output"></div>
    <script type="module">
        const output = document.getElementById('output');
        output.innerHTML = `
            <h2>Environment Variables:</h2>
            <pre>VITE_SUPABASE_URL: ${import.meta.env.VITE_SUPABASE_URL || 'NOT FOUND'}</pre>
            <pre>VITE_SUPABASE_ANON_KEY: ${import.meta.env.VITE_SUPABASE_ANON_KEY ? 'EXISTS' : 'NOT FOUND'}</pre>
            <pre>MODE: ${import.meta.env.MODE || 'NOT FOUND'}</pre>
            <pre>PROD: ${import.meta.env.PROD || 'NOT FOUND'}</pre>

            <h2>All VITE_ variables:</h2>
            <pre>${JSON.stringify(Object.keys(import.meta.env).filter(k => k.startsWith('VITE_')), null, 2)}</pre>
        `;
    </script>
</body>
</html>
